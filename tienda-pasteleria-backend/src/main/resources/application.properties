spring.application.name=tienda-pasteleria-backend
server.port=8080

# ===================================================
# CONEXION A BASE DE DATOS MYSQL (XAMPP)
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ===================================================
# CONFIGURACION JPA / HIBERNATE
# ===================================================
# update: crea o actualiza las tablas automaticamente en MySQL sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
